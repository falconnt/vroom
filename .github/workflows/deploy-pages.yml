name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/site-dev-github-pages-geb54v
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Sta één deploy tegelijk toe.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Schakelt GitHub Pages automatisch in als dat nog niet is gebeurd.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # De hele site is statisch en staat in de repo-root.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
